<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
<title id="title">Venddy Store: monolito modular con ocho módulos</title>
<desc id="desc">Arquitectura objetivo de Venddy: presentación web, una API con ocho módulos explícitos y mecanismos de infraestructura. Catálogo y carta, Pedidos y cocina, Inventario, Caja y ventas, Administración, Plataforma SaaS, Fidelidad y Reportes comparten una unidad de despliegue. Las flechas muestran llamadas durante la ejecución; Clean Architecture regula las dependencias del código hacia el núcleo.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 6 L0 12 Z" fill="#008F88"/></marker></defs>
<rect width="2400" height="1350" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="72" y="82" font-size="60" fill="#082D50" font-weight="700" text-anchor="start">Venddy Store: monolito modular</text>
<text x="74" y="133" font-size="34" fill="#52697D" font-weight="400" text-anchor="start">Una API con ocho módulos. Clean Architecture protege las reglas del negocio.</text>
<rect x="72" y="164" width="2256" height="100" rx="6" fill="#EDF5FF" stroke="#B9CBD9" stroke-width="2" />
<text x="104" y="208" font-size="36" fill="#082D50" font-weight="700" text-anchor="start">1. Presentación web</text>
<text x="600" y="208" font-size="34" fill="#082D50" font-weight="400" text-anchor="start">Comensal, preparación, caja y administración</text>
<text x="104" y="246" font-size="30" fill="#52697D" font-weight="400" text-anchor="start">Next.js / React</text>
<text x="600" y="246" font-size="30" fill="#52697D" font-weight="400" text-anchor="start">Carta QR y pantallas de operación</text>
<rect x="72" y="310" width="2256" height="740" rx="6" fill="white" stroke="#52697D" stroke-width="2" stroke-dasharray="15 9"/>
<text x="104" y="355" font-size="38" fill="#082D50" font-weight="700" text-anchor="start">API Venddy</text>
<text x="2296" y="354" font-size="32" fill="#52697D" font-weight="400" text-anchor="end">Node.js / Express / Socket.IO</text>
<rect x="104" y="380" width="2192" height="58" rx="6" fill="#F1F7FC" stroke="#B9CBD9" stroke-width="2" />
<text x="1200" y="419" font-size="32" fill="#082D50" font-weight="700" text-anchor="middle">Entradas REST y eventos: resolver negocio, identidad y permisos antes de ejecutar</text>
<path d="M1200 264 V380" fill="none" stroke="#008F88" stroke-width="3" marker-end="url(#arrow)" />
<rect x="1045" y="276" width="310" height="38" rx="6" fill="white" stroke="white" stroke-width="2" />
<text x="1200" y="305" font-size="28" fill="#52697D" font-weight="400" text-anchor="middle">HTTPS / WSS</text>
<text x="104" y="470" font-size="30" fill="#52697D" font-weight="700" text-anchor="start">2. Aplicación y dominio</text>
