<text x="36" y="48" font-family="Arial, sans-serif" font-size="34" fill="#082d50" font-weight="700" text-anchor="start">C4. Secuencia de registro del pedido</text>
<text x="36" y="86" font-family="Arial, sans-serif" font-size="21" fill="#52697d" font-weight="400" text-anchor="start">Para un pedido nuevo. Un intento existente se reconoce antes de volver a reservar stock.</text>
