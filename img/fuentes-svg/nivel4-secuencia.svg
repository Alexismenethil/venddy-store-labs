<text x="127" y="613" font-family="Arial, sans-serif" font-size="20" fill="#52697d" font-weight="400" text-anchor="start">Pedido y avisoPendiente</text>
<text x="36" y="690" font-family="Arial, sans-serif" font-size="21" fill="#52697d" font-weight="400" text-anchor="start">Un aviso fallido conserva el pedido. El mismo intento no duplica la reserva. Caja cobra después.</text>
