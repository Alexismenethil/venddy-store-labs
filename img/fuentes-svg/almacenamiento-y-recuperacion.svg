<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#196bdb"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#008f86"/></marker></defs>
<text x="36" y="48" font-family="Arial, sans-serif" font-size="34" fill="#082d50" font-weight="700" text-anchor="start">Datos, archivos y recuperación</text>
<text x="36" y="86" font-family="Arial, sans-serif" font-size="21" fill="#52697d" font-weight="400" text-anchor="start">Una base atiende la operación. Los archivos y las copias tienen responsabilidades distintas.</text>
<rect x="55" y="173" width="460" height="159" rx="5" fill="#082d50" stroke="#a9bdcf" stroke-width="1.5"/>
<text x="285.0" y="210" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700" text-anchor="middle">PostgreSQL principal</text>
<text x="285.0" y="247" font-family="Arial, sans-serif" font-size="23" fill="white" font-weight="400" text-anchor="middle">Neon: pedidos, cobros y stock</text>
<text x="285.0" y="278" font-family="Arial, sans-serif" font-size="23" fill="white" font-weight="400" text-anchor="middle">Lecturas y escrituras de la API</text>
<rect x="765" y="173" width="460" height="159" rx="5" fill="#edf5fc" stroke="#a9bdcf" stroke-width="1.5"/>
<text x="995.0" y="210" font-family="Arial, sans-serif" font-size="27" fill="#082d50" font-weight="700" text-anchor="middle">Almacenamiento de fotos</text>
<text x="995.0" y="247" font-family="Arial, sans-serif" font-size="22" fill="#082d50" font-weight="400" text-anchor="middle">Cloudinary en informe del 02/10</text>
<text x="995.0" y="277" font-family="Arial, sans-serif" font-size="22" fill="#082d50" font-weight="400" text-anchor="middle">R2 como objetivo de migración</text>
<rect x="55" y="476" width="460" height="144" rx="5" fill="#e8f7f2" stroke="#a9bdcf" stroke-width="1.5"/>
<text x="285.0" y="513" font-family="Arial, sans-serif" font-size="27" fill="#082d50" font-weight="700" text-anchor="middle">Respaldo privado</text>
<text x="285.0" y="550" font-family="Arial, sans-serif" font-size="23" fill="#082d50" font-weight="400" text-anchor="middle">Copias de base y archivos</text>
<text x="285.0" y="581" font-family="Arial, sans-serif" font-size="23" fill="#082d50" font-weight="400" text-anchor="middle">Objetivo: R2 privado</text>
<rect x="765" y="476" width="460" height="144" rx="5" fill="#e8f7f2" stroke="#a9bdcf" stroke-width="1.5"/>
<text x="995.0" y="513" font-family="Arial, sans-serif" font-size="25" fill="#082d50" font-weight="700" text-anchor="middle">PostgreSQL de recuperación</text>
<text x="995.0" y="550" font-family="Arial, sans-serif" font-size="23" fill="#082d50" font-weight="400" text-anchor="middle">Neon separado, bajo demanda</text>
<text x="995.0" y="581" font-family="Arial, sans-serif" font-size="23" fill="#082d50" font-weight="400" text-anchor="middle">Sin tráfico comercial</text>
<polyline points="285,332 285,476" fill="none" stroke="#008f86" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#green)"/>
<text x="304" y="411" font-family="Arial, sans-serif" font-size="20" fill="#52697d" font-weight="400" text-anchor="start">Copia diaria</text>
<polyline points="995,332 995,386 630,386 630,550 515,550" fill="none" stroke="#008f86" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#green)"/>
<text x="600" y="365" font-family="Arial, sans-serif" font-size="20" fill="#52697d" font-weight="400" text-anchor="start">Copia de archivos</text>
<polyline points="515,580 765,580" fill="none" stroke="#196bdb" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="535" y="615" font-family="Arial, sans-serif" font-size="20" fill="#52697d" font-weight="400" text-anchor="start">Restaurar y validar</text>
<text x="36" y="690" font-family="Arial, sans-serif" font-size="21" fill="#52697d" font-weight="400" text-anchor="start">Objetivos externos: RPO 24 h y RTO 2 h por ensayar. Sin réplica activa ni failover automático.</text>
</svg>