<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480" role="img" aria-labelledby="title desc">
<title id="title">Clean Architecture aplicada a Venddy Store</title>
<desc id="desc">Círculos con Dominio, Aplicación y adaptadores externos. Presentación usa los casos de uso; Aplicación depende de Dominio; Infraestructura implementa contratos. app.config.ts conecta los adaptadores. El comensal registra un pedido sin procesar pago. Caja registra un cobro interno en otra operación. Las flechas representan dependencias de código.</desc>
<defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#344a63" /></marker></defs>
<rect width="2200" height="1480" fill="white" />
<g font-family="Arial, Helvetica, sans-serif" fill="#202833">
<text x="50" y="53" font-size="30" font-weight="700" text-anchor="start" fill="#202833">CLEAN ARCHITECTURE · VENDDY STORE</text>
<text x="2150" y="52" font-size="22" font-weight="400" text-anchor="end" fill="#66717e">Guía 03 · Paso 5</text>
<text x="50" y="91" font-size="23" font-weight="400" text-anchor="start" fill="#66717e">Responsabilidades separadas y dependencias del código hacia el núcleo del negocio.</text>
<circle cx="550" cy="675" r="500" fill="#d9edfc" stroke="#778594" stroke-width="2.5" />
<circle cx="550" cy="675" r="390" fill="#dcf2dc" stroke="#778594" stroke-width="2.5" />
